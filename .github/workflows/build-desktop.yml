name: Build ZenithTee Desktop

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

env:
  DDNET_SHA: 7cbcf36af5acd6a36c57952000f7e46c19f91ebf
  CARGO_HTTP_MULTIPLEXING: false
  PRIVATE_REPO: polojodj-sketch/lovely
  ZENITHTEE_CHANNEL: alpha
  RELEASE_REPO: polojodj-sketch/zenithtee-client-dist
  RELEASE_TAG: desktop-latest

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
    - name: Clone private source (lovely)
      env:
        PAT: ${{ secrets.PRIVATE_REPO_PAT }}
      run: |
        set -e
        git clone --depth 1 "https://x-access-token:${PAT}@github.com/${PRIVATE_REPO}.git" lovely

    - name: Prepare Linux
      run: |
        sudo apt-get update -y
        sudo apt-get install -y ninja-build build-essential git cmake \
          libsdl2-dev libfreetype6-dev libcurl4-openssl-dev libssl-dev \
          libogg-dev libopus-dev libopusfile-dev libwavpack-dev \
          libglew-dev libgl1-mesa-dev libsqlite3-dev libpng-dev \
          libwebsockets-dev libminiupnpc-dev libnotify-dev
        rustup default 1.92.0

    - name: Clone + patch DDNet
      run: |
        set -e
        git clone --depth 1000 https://github.com/ddnet/ddnet.git ddnet
        cd ddnet
        git fetch --depth 1000 origin master
        git checkout "$DDNET_SHA"
        for sm in $(git submodule status | awk '{print $2}'); do
          git submodule update --init --depth 1000 "$sm"
        done
        mkdir -p src/engine/external/lua
        cp "$GITHUB_WORKSPACE"/lovely/assets/lua/* src/engine/external/lua/
        mkdir -p src/engine/external/sol2/sol
        cp "$GITHUB_WORKSPACE/lovely/assets/sol.hpp" src/engine/external/sol2/sol.hpp
        cp "$GITHUB_WORKSPACE/lovely/assets/sol_config.hpp" src/engine/external/sol2/sol/config.hpp
        for p in ../lovely/patches/*.patch; do
          sed -i 's/\r$//' "$p"
          git apply --whitespace=nowarn "$p"
        done

    - name: Build Linux
      run: |
        set -e
        cd ddnet
        cmake -S . -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCLIENT=ON -DSERVER=ON -DDISCORD=OFF -DVULKAN=OFF -DVIDEORECORDER=OFF \
          -DZENITHTEE_BUILD=$(ls ../lovely/patches/*.patch | wc -l) \
          -DZENITHTEE_CHANNEL="$ZENITHTEE_CHANNEL"
        cmake --build build --parallel "$(nproc)" --target game-client game-server

    - name: Package Linux
      run: |
        set -e
        cd ddnet
        mkdir -p package
        cp build/DDNet build/DDNet-Server package/
        cp -r data package/data
        cat > package/run.sh <<'EOF'
        #!/usr/bin/env sh
        cd "$(dirname "$0")"
        ./DDNet
        EOF
        chmod +x package/run.sh package/DDNet package/DDNet-Server
        cd package
        zip -qr ../artifacts-linux.zip .

    - name: Upload Linux ZIP
      uses: actions/upload-artifact@v4
      with:
        name: ZenithTee-Linux
        path: ddnet/artifacts-linux.zip
        if-no-files-found: error

    - name: Publish Linux to private releases
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      env:
        GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
      run: |
        set -e
        cd ddnet
        BUILD=$(ls "$GITHUB_WORKSPACE"/lovely/patches/*.patch | wc -l)
        TAG="${RELEASE_TAG}"
        RELEASE_URL="https://github.com/${RELEASE_REPO}/releases/download/${TAG}"
        
        # Ensure release exists (idempotent)
        if ! gh release view "$TAG" --repo "${RELEASE_REPO}" >/dev/null 2>&1; then
          echo '{"schema":1,"channel":"'"${ZENITHTEE_CHANNEL}"'","build":'"${BUILD}"',"platform":"placeholder","url":"","size":0,"sha256":""}' > version-placeholder.json
          gh release create "$TAG" version-placeholder.json --repo "${RELEASE_REPO}" --title "ZenithTee Desktop b${BUILD}" --notes "Build ${BUILD} (${ZENITHTEE_CHANNEL})" --prerelease
          rm version-placeholder.json
        fi
        
        if [ -f artifacts-linux.zip ]; then
          SHA256_LINUX=$(sha256sum artifacts-linux.zip | cut -d' ' -f1)
          SIZE_LINUX=$(stat -c%s artifacts-linux.zip)
          MANIFEST_LINUX='{"schema":1,"channel":"'"${ZENITHTEE_CHANNEL}"'","build":'"${BUILD}"',"platform":"linux","url":"'"${RELEASE_URL}/ZenithTee-linux-${BUILD}.zip"'","size":'"${SIZE_LINUX}"',"sha256":"'"${SHA256_LINUX}"'"}'
          echo "$MANIFEST_LINUX" > "version-linux.json"
          cp artifacts-linux.zip "ZenithTee-linux-${BUILD}.zip"
          gh release upload "$TAG" "ZenithTee-linux-${BUILD}.zip" "version-linux.json" --repo "${RELEASE_REPO}" --clobber
          echo "Published Linux to ${RELEASE_REPO}@${TAG}"
        fi

  build-windows:
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
    - name: Clone private source (lovely)
      env:
        PAT: ${{ secrets.PRIVATE_REPO_PAT }}
      run: |
        set -e
        git clone --depth 1 "https://x-access-token:${PAT}@github.com/${PRIVATE_REPO}.git" lovely

    - name: Prepare Windows
      run: |
        git config --global core.autocrlf false
        git config --global core.eol lf
        rustup default 1.92.0

    - name: Clone + patch DDNet
      run: |
        set -e
        git clone --depth 1000 https://github.com/ddnet/ddnet.git ddnet
        cd ddnet
        git fetch --depth 1000 origin master
        git checkout "$DDNET_SHA"
        for sm in $(git submodule status | awk '{print $2}'); do
          git submodule update --init --depth 1000 "$sm"
        done
        mkdir -p src/engine/external/lua
        cp "$GITHUB_WORKSPACE"/lovely/assets/lua/* src/engine/external/lua/
        mkdir -p src/engine/external/sol2/sol
        cp "$GITHUB_WORKSPACE/lovely/assets/sol.hpp" src/engine/external/sol2/sol.hpp
        cp "$GITHUB_WORKSPACE/lovely/assets/sol_config.hpp" src/engine/external/sol2/sol/config.hpp
        for p in ../lovely/patches/*.patch; do
          sed -i 's/\r$//' "$p"
          git apply --whitespace=nowarn "$p"
        done

    - name: Build Windows
      run: |
        set -e
        cd ddnet
        cmake -S . -B build -G "Visual Studio 17 2022" -A x64 \
          -DCLIENT=ON -DSERVER=ON -DDISCORD=OFF -DVULKAN=OFF -DVIDEORECORDER=OFF \
          -DZENITHTEE_BUILD=$(ls ../lovely/patches/*.patch | wc -l) \
          -DZENITHTEE_CHANNEL="$ZENITHTEE_CHANNEL"
        cmake --build build --config Release --parallel 4 --target game-client game-server

    - name: Package Windows
      run: |
        set -e
        cd ddnet
        mkdir -p package
        cp build/Release/DDNet.exe build/Release/DDNet-Server.exe package/ 2>/dev/null || cp build/Release/DDNet.exe package/
        for d in ddnet-libs/*/windows/lib64; do
          cp "$d"/*.dll package/ 2>/dev/null || true
        done
        cp build/Release/*.dll package/ 2>/dev/null || true
        cp -r data package/data
        powershell -Command "Compress-Archive -Path 'package/*' -DestinationPath 'artifacts-windows.zip' -Force"

    - name: Upload Windows ZIP
      uses: actions/upload-artifact@v4
      with:
        name: ZenithTee-Windows
        path: ddnet/artifacts-windows.zip
        if-no-files-found: error

    - name: Publish Windows to private releases
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      env:
        GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
      run: |
        set -e
        cd ddnet
        BUILD=$(ls "$GITHUB_WORKSPACE"/lovely/patches/*.patch | wc -l)
        TAG="${RELEASE_TAG}"
        RELEASE_URL="https://github.com/${RELEASE_REPO}/releases/download/${TAG}"
        
        # Ensure release exists (idempotent)
        if ! gh release view "$TAG" --repo "${RELEASE_REPO}" >/dev/null 2>&1; then
          echo '{"schema":1,"channel":"'"${ZENITHTEE_CHANNEL}"'","build":'"${BUILD}"',"platform":"placeholder","url":"","size":0,"sha256":""}' > version-placeholder.json
          gh release create "$TAG" version-placeholder.json --repo "${RELEASE_REPO}" --title "ZenithTee Desktop b${BUILD}" --notes "Build ${BUILD} (${ZENITHTEE_CHANNEL})" --prerelease
          rm version-placeholder.json
        fi
        
        if [ -f artifacts-windows.zip ]; then
          SHA256_WIN=$(sha256sum artifacts-windows.zip | cut -d' ' -f1)
          SIZE_WIN=$(stat -c%s artifacts-windows.zip)
          MANIFEST_WIN='{"schema":1,"channel":"'"${ZENITHTEE_CHANNEL}"'","build":'"${BUILD}"',"platform":"windows","url":"'"${RELEASE_URL}/ZenithTee-windows-${BUILD}.zip"'","size":'"${SIZE_WIN}"',"sha256":"'"${SHA256_WIN}"'"}'
          echo "$MANIFEST_WIN" > "version-windows.json"
          cp artifacts-windows.zip "ZenithTee-windows-${BUILD}.zip"
          gh release upload "$TAG" "ZenithTee-windows-${BUILD}.zip" "version-windows.json" --repo "${RELEASE_REPO}" --clobber
          echo "Published Windows to ${RELEASE_REPO}@${TAG}"
        fi